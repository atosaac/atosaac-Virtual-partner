[project]
name = "atosaac-virtual-partner"
version = "0.2.0"
description = "A local AI virtual companion for macOS."
readme = "README.md"
authors = [
    { name = "atosaac", email = "165299099+atosaac@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
atosaac-virtual-partner = "atosaac_virtual_partner.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".DS_Store"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
